<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Receipts - FeeFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main-container">
        <header class="top-header">
            <div class="page-title">
                <h1>Payment Receipts</h1>
                <p>Generate and view transaction history receipts</p>
            </div>
            <div class="header-right" id="header-right">Academic Year 2026</div>
        </header>

        <div class="content-body">
            <div class="card">
                <div class="card-header"><h3>Issued Receipts</h3></div>
                <table>
                    <thead>
                        <tr>
                            <th>Receipt No.</th><th>Admission No.</th><th>Student Name</th><th>Year</th>
                            <th>Amount</th><th>Payment Mode</th><th>Date</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="rows"><tr class="empty-row"><td colspan="8">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/receipts.js"></script>
</body>
</html>
