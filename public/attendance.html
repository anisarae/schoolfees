<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance - FeeFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main-container">
        <header class="top-header">
            <div class="page-title">
                <h1>Daily Attendance</h1>
                <p>Track student presence and absences</p>
            </div>
            <div class="header-right" id="header-right"><span id="date-label"></span></div>
        </header>

        <div class="content-body">
            <div class="stats-grid">
                <div class="stat-card"><p>Present</p><h3 id="sum-present">--</h3></div>
                <div class="stat-card"><p>Absent</p><h3 id="sum-absent">--</h3></div>
                <div class="stat-card"><p>Attendance Rate</p><h3 id="sum-rate">--</h3></div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3>Class Register</h3>
                    <div class="toolbar">
                        <input type="date" id="date">
                        <button class="btn btn-outline" id="btn-all-present">Mark all present</button>
                        <button class="btn" id="btn-save">Save Attendance</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr><th>Admission No.</th><th>Student Name</th><th>Year</th><th>Status (click to change)</th></tr>
                    </thead>
                    <tbody id="rows"><tr class="empty-row"><td colspan="4">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
